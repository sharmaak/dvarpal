# Selects which broker(s) dvarpal logs into: upstox | zerodha | all.
broker: zerodha

# Shared across all brokers (independent of which broker(s) are selected).
browser_useragent: Mozilla/5.0 (X11; Ubuntu; Linux x86_64; rv:15.0) Gecko/20100101 Firefox/15.0.1
browser_headless: false

zerodha:
  authn_url: https://kite.zerodha.com/connect/login
  authz_url: https://api.kite.trade/session/token
  session_validation_url: https://api.kite.trade/user/profile

  # redirect_uri is configured against your Kite Connect app on
  # developers.kite.trade, not passed in the login URL. It is still required
  # here so dvarpal can detect it in the post-login redirect.
  redirect_uri: <your-redirect-url>

  # The following properties are part of the Kite Connect app created for API access
  client_id: <your-api-key>
  client_secret: <your-api-secret>

  user_id: <your zerodha user id>
  password: <your zerodha password>

  # Set totp_secret_key if your account's second factor is TOTP, generated using
  # https://kite.trade/docs/connect/v3/user/#login-flow
  # Leave it unset and set `pin` instead if your second factor is a PIN.
  totp_secret_key: <your TOTP secret key>
  pin: <your pin>
